<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="96" height="96" role="img" aria-label="Binonce">
  <title>Binonce</title>
  <style>
    .d{fill:#686358;opacity:.15;animation:d 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .l{fill:#E5431F;animation:l 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes d{0%,100%{opacity:.15}35%,60%{opacity:.6}}
    @keyframes l{0%,30%{opacity:.25;transform:scale(.7)}50%,85%{opacity:1;transform:none}100%{opacity:.25;transform:scale(.7)}}
    @media (prefers-color-scheme:dark){.d{fill:#9A958A}}
    @media (prefers-reduced-motion:reduce){.d,.l{animation:none;opacity:1}.d{opacity:.45}}
  </style>
  <rect class="l" x=".75" y=".75" width="6.5" height="6.5" rx="1.25"/>
  <circle class="d" cx="11" cy="4" r="1.7" style="animation-delay:.09s"/>
  <circle class="d" cx="18" cy="4" r="1.7" style="animation-delay:.18s"/>
  <circle class="d" cx="4" cy="11" r="1.7" style="animation-delay:.27s"/>
  <circle class="d" cx="11" cy="11" r="1.7" style="animation-delay:.36s"/>
  <circle class="d" cx="18" cy="11" r="1.7" style="animation-delay:.45s"/>
  <circle class="d" cx="4" cy="18" r="1.7" style="animation-delay:.54s"/>
  <circle class="d" cx="11" cy="18" r="1.7" style="animation-delay:.63s"/>
  <circle class="d" cx="18" cy="18" r="1.7" style="animation-delay:.72s"/>
</svg>
